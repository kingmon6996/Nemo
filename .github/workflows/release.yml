name: Release Nemo

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.20.0"

      - name: Build nemo wheels
        run: python -m cibuildwheel --output-dir wheelhouse .
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: "yum install -y gcc-toolset-12-gcc-c++ || true"
          CIBW_ENVIRONMENT_LINUX: 'PATH="/opt/rh/gcc-toolset-12/root/usr/bin:$PATH" CC="/opt/rh/gcc-toolset-12/root/usr/bin/gcc" CXX="/opt/rh/gcc-toolset-12/root/usr/bin/g++"'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET="11.0"'

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist .

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nemo-py
    permissions:
      id-token: write
      contents: read
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build_cpp:
    name: Build C++ Library on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNEMO_BUILD_TESTS=OFF -DNEMO_BUILD_EXAMPLES=OFF

      - name: Build C++ library
        run: cmake --build build --config Release

      - name: Package library (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p nemo-cpp-${{ runner.os }}
          find build -type f -name "libnemo.*" -exec cp {} nemo-cpp-${{ runner.os }}/ \; 2>/dev/null || true
          cp -r include nemo-cpp-${{ runner.os }}/
          tar -czvf nemo-cpp-${{ runner.os }}.tar.gz nemo-cpp-${{ runner.os }}

      - name: Package library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path nemo-cpp-Windows
          Get-ChildItem -Path build -Recurse -File -Include nemo.lib, nemo.dll | ForEach-Object { Copy-Item $_.FullName nemo-cpp-Windows/ }
          Copy-Item -Recurse include nemo-cpp-Windows/
          Compress-Archive -Force -Path nemo-cpp-Windows -DestinationPath nemo-cpp-Windows.zip

      - name: Upload C++ Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: nemo-cpp-${{ runner.os }}
          path: |
            nemo-cpp-*.tar.gz
            nemo-cpp-*.zip
          if-no-files-found: ignore

      - name: Attach C++ Artifacts to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nemo-cpp-*.tar.gz
            nemo-cpp-*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
